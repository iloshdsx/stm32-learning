<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630">
  <rect width="960" height="630" fill="#ffffff"/>

  <text x="480" y="48" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" fill="#0f172a">ST-Link V2 → STM32F103C8T6 接线图</text>
  <text x="480" y="80" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle" fill="#64748b">只用 4 根杜邦线（母对母），其余针脚全部空着</text>

  <!-- ================= ST-Link ================= -->
  <rect x="48" y="272" width="52" height="56" rx="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <text x="74" y="306" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#334155">USB</text>
  <text x="74" y="352" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">插电脑</text>

  <rect x="100" y="160" width="250" height="280" rx="14" fill="#2b579a"/>
  <text x="225" y="215" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">ST-Link V2</text>
  <text x="225" y="248" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#c7d9f0">10 个针里只接这 4 个</text>

  <text x="336" y="286" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" text-anchor="end" fill="#ffffff">3.3V</text>
  <text x="336" y="331" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" text-anchor="end" fill="#ffffff">SWDIO</text>
  <text x="336" y="376" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" text-anchor="end" fill="#ffffff">SWCLK</text>
  <text x="336" y="421" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" text-anchor="end" fill="#ffffff">GND</text>

  <circle cx="350" cy="280" r="9" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <circle cx="350" cy="325" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="350" cy="370" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="350" cy="415" r="9" fill="#111827" stroke="#ffffff" stroke-width="2"/>

  <!-- ================= 连线 ================= -->
  <line x1="358" y1="280" x2="602" y2="280" stroke="#dc2626" stroke-width="5"/>
  <line x1="358" y1="325" x2="602" y2="325" stroke="#f59e0b" stroke-width="5"/>
  <line x1="358" y1="370" x2="602" y2="370" stroke="#16a34a" stroke-width="5"/>
  <line x1="358" y1="415" x2="602" y2="415" stroke="#111827" stroke-width="5"/>

  <text x="480" y="268" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">3.3V → 3V3</text>
  <text x="480" y="313" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#b45309">SWDIO → DIO</text>
  <text x="480" y="358" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#16a34a">SWCLK → CLK</text>
  <text x="480" y="403" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">GND → GND</text>

  <!-- ================= Blue Pill ================= -->
  <rect x="610" y="130" width="310" height="340" rx="14" fill="#1e5fa8"/>
  <text x="765" y="178" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#ffffff">STM32F103C8T6</text>
  <text x="765" y="204" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#c7d9f0">最小系统板（Blue Pill）</text>

  <rect x="680" y="250" width="190" height="140" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="775" y="315" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">STM32</text>
  <text x="775" y="345" font-family="Microsoft YaHei, sans-serif" font-size="16" text-anchor="middle" fill="#94a3b8">F103C8T6</text>

  <circle cx="610" cy="280" r="9" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <circle cx="610" cy="325" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="610" cy="370" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="610" cy="415" r="9" fill="#111827" stroke="#ffffff" stroke-width="2"/>

  <text x="628" y="286" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">3V3</text>
  <text x="628" y="331" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">DIO</text>
  <text x="628" y="376" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">CLK</text>
  <text x="628" y="421" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">GND</text>

  <text x="765" y="232" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#c7d9f0">↓ 这 4 根针排在板子的一端</text>

  <!-- ================= 注意 ================= -->
  <rect x="60" y="500" width="840" height="112" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="85" y="530" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#9a3412">⚠ 千万不要接 5V —— 板子要 3.3V，接 5V 可能烧芯片</text>
  <text x="85" y="556" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#9a3412">⚠ GND 必须接 —— 漏了 ST-Link 就认不到板子</text>
  <text x="85" y="582" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7c2d12">其他针（5V / SWIM / RST …）全部空着不接　|　杜邦线颜色随便，插对针就行</text>
  <text x="85" y="605" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7c2d12">认丝印上的字，不要认位置 —— 下载器和板子的排列都可能不一样</text>
</svg>
