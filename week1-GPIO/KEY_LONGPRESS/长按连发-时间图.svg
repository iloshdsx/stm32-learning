<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490"
     font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif">
  <rect width="880" height="490" fill="#ffffff"/>

  <text x="440" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">
    长按连发：按住 1 秒后，每 1 秒翻转一次
  </text>

  <!-- ================= 按键电平 ================= -->
  <text x="16" y="116" font-size="14" fill="#333333">按键电平</text>

  <!-- 高/低 标记 -->
  <text x="64" y="70"  font-size="11.5" fill="#888888">1 高（松开）</text>
  <text x="64" y="158" font-size="11.5" fill="#888888">0 低（按下）</text>

  <!-- 波形 -->
  <polyline points="60,80 140,80 140,140 800,140 800,80 860,80"
            fill="none" stroke="#2b7de9" stroke-width="3.5"
            stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ================= 刻度虚线 ================= -->
  <line x1="140" y1="58" x2="140" y2="340" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="340" y1="58" x2="340" y2="340" stroke="#e2574c" stroke-width="1.8" stroke-dasharray="6,5"/>
  <line x1="540" y1="58" x2="540" y2="340" stroke="#e2574c" stroke-width="1.8" stroke-dasharray="6,5"/>
  <line x1="740" y1="58" x2="740" y2="340" stroke="#e2574c" stroke-width="1.8" stroke-dasharray="6,5"/>

  <!-- 虚线标签 -->
  <text x="146" y="54" font-size="12.5" fill="#666666">按下那一瞬</text>
  <text x="348" y="54" font-size="12.5" fill="#e2574c">翻转 ①</text>
  <text x="548" y="54" font-size="12.5" fill="#e2574c">翻转 ②</text>
  <text x="748" y="54" font-size="12.5" fill="#e2574c">翻转 ③</text>

  <!-- ================= 1000ms 箭头 ================= -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <g stroke="#5a5a5a" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)">
    <line x1="140" y1="196" x2="340" y2="196"/>
    <line x1="340" y1="196" x2="540" y2="196"/>
    <line x1="540" y1="196" x2="740" y2="196"/>
  </g>
  <text x="240" y="189" font-size="12.5" fill="#5a5a5a" text-anchor="middle">1000 ms</text>
  <text x="440" y="189" font-size="12.5" fill="#5a5a5a" text-anchor="middle">1000 ms</text>
  <text x="640" y="189" font-size="12.5" fill="#5a5a5a" text-anchor="middle">1000 ms</text>

  <!-- ================= LED 状态 ================= -->
  <text x="16" y="290" font-size="14" fill="#333333">LED 状态</text>

  <text x="70" y="256" font-size="12" fill="#888888">亮</text>
  <text x="70" y="336" font-size="12" fill="#888888">灭</text>

  <polyline points="60,310 340,310 340,250 540,250 540,310 740,310 740,250 860,250"
            fill="none" stroke="#2aa35b" stroke-width="3.5"
            stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 松开标记 -->
  <line x1="800" y1="58" x2="800" y2="340" stroke="#9b9b9b" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="806" y="54" font-size="12.5" fill="#666666">松开</text>

  <!-- ================= 说明框 ================= -->
  <rect x="40" y="364" width="800" height="106" rx="10"
        fill="#f5f8fd" stroke="#cfdcf0" stroke-width="1.5"/>

  <text x="60" y="392" font-size="13.5" fill="#1a3b6d">① 按下那一瞬，把「现在几点」记进 press_tick —— 这是计时起点。</text>
  <text x="60" y="418" font-size="13.5" fill="#1a3b6d">② 之后每过 1000 ms，翻转一次 LED，并把 press_tick 前移到「刚才翻转的时刻」。</text>
  <text x="60" y="444" font-size="13.5" fill="#1a3b6d">③ 只要手不松，就一直是「每 1 秒翻一次」——这就是长按连发。松手后 press_tick 不再更新，连发自然停止。</text>
</svg>
