<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif">
<rect width="1240" height="720" fill="#ffffff"/>
<text x="620" y="46" font-size="23" font-weight="bold" text-anchor="middle" fill="#111111">第 2 周 · 第 2 课：PWM 呼吸灯 —— 接线图</text>
<text x="620" y="76" font-size="13.5" text-anchor="middle" fill="#6b7075">PA6 出 PWM  →  1 kΩ 电阻  →  LED  →  回到 GND</text>
<rect x="60" y="110" width="1120" height="220" rx="14" fill="#f6f9fe" stroke="#cfdcf0" stroke-width="1.5"/>
<rect x="100" y="189" width="120" height="52" rx="8" fill="#e8eef7" stroke="#22507f" stroke-width="2"/>
<text x="160" y="213" font-size="15" font-weight="bold" text-anchor="middle" fill="#22507f">PA6</text>
<text x="160" y="231" font-size="10.5" text-anchor="middle" fill="#5a7fa6">TIM3_CH1</text>
<line x1="220" y1="215" x2="258" y2="215" stroke="#ff8a00" stroke-width="3.4"/>
<rect x="258" y="200" width="112" height="30" rx="5" fill="#e6d7b4" stroke="#8a7a55" stroke-width="1.5"/>
<rect x="290" y="200" width="11" height="30" fill="#7b4a12"/>
<rect x="308" y="200" width="11" height="30" fill="#111111"/>
<rect x="326" y="200" width="11" height="30" fill="#d02b1f"/>
<rect x="348" y="200" width="11" height="30" fill="#c9a227"/>
<text x="314" y="189" font-size="14" font-weight="bold" text-anchor="middle" fill="#8a5a12">1 kΩ</text>
<text x="324" y="253" font-size="11" text-anchor="middle" fill="#8a7a55">棕　黑　红　金</text>
<line x1="370" y1="215" x2="428" y2="215" stroke="#ff8a00" stroke-width="3.4"/>
<polygon points="428,191 428,239 486,215" fill="#e94b3c" stroke="#b8382c" stroke-width="1.5"/>
<line x1="486" y1="191" x2="486" y2="239" stroke="#b8382c" stroke-width="4"/>
<line x1="428" y1="191" x2="428" y2="239" stroke="#b8382c" stroke-width="4"/>
<line x1="452" y1="185" x2="462" y2="173" stroke="#e94b3c" stroke-width="2.2"/>
<polygon points="462,173 456,175 461,180" fill="#e94b3c"/>
<line x1="466" y1="175" x2="476" y2="163" stroke="#e94b3c" stroke-width="2.2"/>
<polygon points="476,163 470,165 475,170" fill="#e94b3c"/>
<text x="457" y="259" font-size="12" text-anchor="middle" fill="#b8382c">LED</text>
<line x1="486" y1="215" x2="556" y2="215" stroke="#ff8a00" stroke-width="3.4"/>
<rect x="556" y="189" width="130" height="52" rx="8" fill="#eceff1" stroke="#555555" stroke-width="2"/>
<text x="621" y="213" font-size="15" font-weight="bold" text-anchor="middle" fill="#333333">GND</text>
<text x="621" y="231" font-size="10.5" text-anchor="middle" fill="#777777">板子上的 G</text>
<text x="336" y="289" font-size="12.5" text-anchor="middle" fill="#c05600">电流方向：PA6 流出  →  电阻限流  →  LED 发光  →  回到 GND</text>
<rect x="720" y="130" width="440" height="180" rx="12" fill="#fff4e8" stroke="#f0cfa8" stroke-width="1.5"/>
<text x="744" y="160" font-size="14" font-weight="bold" fill="#8a4b12">为什么要串电阻？</text>
<text x="744" y="186" font-size="12.5" fill="#8a4b12">LED 内阻很小，直接接 3.3V → 瞬间很大电流</text>
<text x="744" y="207" font-size="12.5" fill="#8a4b12">→ LED 烧掉，严重时把板子的脚也烧了</text>
<text x="744" y="228" font-size="12.5" fill="#8a4b12"></text>
<text x="744" y="249" font-size="12.5" fill="#8a4b12">串 1 kΩ 之后：</text>
<text x="744" y="270" font-size="12.5" fill="#8a4b12">电流 ≈ (3.3V − 2.0V) ÷ 1000Ω ≈ 1.3 mA</text>
<text x="744" y="291" font-size="12.5" fill="#8a4b12">够亮，而且绝对安全。</text>
<rect x="60" y="360" width="500" height="320" rx="14" fill="#fbfbfd" stroke="#dcdce2" stroke-width="1.5"/>
<text x="84" y="392" font-size="14.5" font-weight="bold" fill="#333333">LED 怎么认正负？</text>
<circle cx="204" cy="518" r="50" fill="#f7d3ce" stroke="#c0392b" stroke-width="2.5"/>
<line x1="166" y1="486" x2="166" y2="550" stroke="#c0392b" stroke-width="3.5"/>
<text x="222" y="524" font-size="11" text-anchor="middle" fill="#a03028">发光面</text>
<line x1="186" y1="566" x2="186" y2="608" stroke="#909599" stroke-width="4" stroke-linecap="round"/>
<line x1="214" y1="566" x2="214" y2="652" stroke="#909599" stroke-width="4" stroke-linecap="round"/>
<text x="330" y="572" font-size="13" font-weight="bold" fill="#2b4a7d">短脚 = 负极 (−)</text>
<line x1="322" y1="568" x2="192" y2="596" stroke="#2b4a7d" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="330" y="628" font-size="13" font-weight="bold" fill="#c0392b">长脚 = 正极 (+)</text>
<line x1="322" y1="624" x2="220" y2="646" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="84" y="666" font-size="12" fill="#6b7075">另外：看塑料外壳，平切面那一侧也是负极。</text>
<rect x="600" y="360" width="580" height="320" rx="14" fill="#fbfbfd" stroke="#dcdce2" stroke-width="1.5"/>
<text x="624" y="392" font-size="14.5" font-weight="bold" fill="#333333">哪颗是 1 kΩ？看色环</text>
<rect x="640" y="470" width="480" height="62" rx="10" fill="#e6d7b4" stroke="#8a7a55" stroke-width="1.5"/>
<rect x="676" y="470" width="20" height="62" fill="#7b4a12"/>
<text x="686" y="456" font-size="12.5" text-anchor="middle" fill="#555555">棕</text>
<rect x="716" y="470" width="20" height="62" fill="#111111"/>
<text x="726" y="456" font-size="12.5" text-anchor="middle" fill="#555555">黑</text>
<rect x="756" y="470" width="20" height="62" fill="#d02b1f"/>
<text x="766" y="456" font-size="12.5" text-anchor="middle" fill="#555555">红</text>
<rect x="1046" y="470" width="20" height="62" fill="#c9a227"/>
<text x="1056" y="456" font-size="12.5" text-anchor="middle" fill="#555555">金</text>
<text x="880" y="558" font-size="12" text-anchor="middle" fill="#8a7a55">棕 = 1　　黑 = 0　　红 = ×100　　金 = ±5%</text>
<text x="880" y="594" font-size="15" font-weight="bold" text-anchor="middle" fill="#8a5a12">棕黑 × 红  →  10 × 100 = 1000 Ω = 1 kΩ</text>
<text x="880" y="622" font-size="12.5" text-anchor="middle" fill="#6b7075">读法：前两环是数字，第三环是倍率，最后一环是误差</text>
<text x="880" y="652" font-size="12.5" text-anchor="middle" fill="#c0392b">手边没 1 kΩ 也没关系：470 Ω ~ 2.2 kΩ 都能用，只是亮度不同</text>
</svg>